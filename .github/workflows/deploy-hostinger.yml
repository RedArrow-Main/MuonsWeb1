# Field Ledger style reminder: keep deployment automation quiet, explicit, and dependable for the Muons Technology static site.
#
# Hostinger deploys this site with its own Git integration, which clones a
# branch into the web root. The source tree has no index.html - that only
# exists after a Vite build - so pointing Hostinger at `main` serves nothing.
#
# This workflow builds on every push to main and force-pushes the contents of
# dist/public to the `deploy` branch, whose root IS the website. Hostinger is
# configured to pull `deploy`.
name: Publish built site to the deploy branch

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hostinger-production
  cancel-in-progress: true

jobs:
  build-and-publish:
    name: Build and publish
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        # No version here on purpose: pnpm/action-setup fails when a version is
        # given both here and as packageManager in package.json.
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build production site
        run: pnpm run build

      - name: Drop dev-only files from the build
        run: rm -rf dist/public/__manus__ dist/public/.gitkeep

      - name: Publish dist/public to the deploy branch
        run: |
          set -e
          cd dist/public
          git init -q
          git checkout -q -b deploy
          git add -A
          git -c user.email="actions@github.com" \
              -c user.name="GitHub Actions" \
              commit -q -m "Build of ${GITHUB_SHA}"
          git push -q --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            deploy
          echo "Published $(git ls-files | wc -l) files to the deploy branch."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
