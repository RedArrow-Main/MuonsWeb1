# Temporary diagnostic. Writes the FTP directory tree to the job summary,
# which is readable through the public check-runs API without repository
# admin rights, and drops a marker in every candidate web root.
name: Probe web root

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  probe:
    name: Diagnose
    runs-on: ubuntu-latest
    steps:
      - name: Map the directory tree and drop markers
        env:
          H: ${{ secrets.HOSTINGER_FTP_SERVER }}
          U: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          P: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
        run: |
          set +e
          ls_ () {
            curl -sS --ssl-reqd --connect-timeout 20 --max-time 45 \
                 -u "$U:$P" --list-only "ftp://$H/$1" 2>/dev/null
          }
          say () { echo "$1" >> "$GITHUB_STEP_SUMMARY"; }

          say "## FTP tree"
          say ""
          say '### login dir'
          say '```'
          ls_ "" >> "$GITHUB_STEP_SUMMARY"
          say '```'

          say '### domains/'
          say '```'
          ls_ "domains/" > /tmp/doms.txt
          cat /tmp/doms.txt >> "$GITHUB_STEP_SUMMARY"
          say '```'

          # For each site under domains/, show its layout and drop a marker
          # named after it, so an HTTP fetch identifies the served one.
          while read -r d; do
            [ -z "$d" ] && continue
            say "### domains/$d/"
            say '```'
            ls_ "domains/$d/" >> "$GITHUB_STEP_SUMMARY"
            say '```'
            say "### domains/$d/public_html/"
            say '```'
            ls_ "domains/$d/public_html/" >> "$GITHUB_STEP_SUMMARY"
            say '```'

            slug=$(printf '%s' "$d" | tr -c 'a-zA-Z0-9' '-')
            echo "served dir is domains/$d/public_html" > /tmp/m.txt
            if curl -sS --ssl-reqd --ftp-create-dirs --connect-timeout 20 --max-time 45 \
                    -u "$U:$P" -T /tmp/m.txt \
                    "ftp://$H/domains/$d/public_html/probe-$slug.txt"; then
              say "marker placed: probe-$slug.txt"
            else
              say "marker FAILED: probe-$slug.txt"
            fi
          done < /tmp/doms.txt

          say ""
          say "Fetch https://muonstechnology.com/probe-<slug>.txt for each marker above."
