# Field Ledger style reminder: keep deployment automation quiet, explicit, and dependable for the Muons Technology static site.
name: Deploy Muons Technology to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hostinger-production
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build and deploy production site
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # No version here on purpose: pnpm/action-setup@v4 fails outright when a
      # version is given both here and as packageManager in package.json, which
      # is what broke every previous run. package.json is the single source.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build production site
        run: pnpm run build

      - name: Deploy dist/public to Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.HOSTINGER_FTP_SERVER }}
          username: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          local-dir: ./dist/public/
          server-dir: ./public_html/
          protocol: ftps
          port: 21
          dangerous-clean-slate: false
          log-level: standard
